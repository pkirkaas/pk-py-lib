[project]
name = "pk-py-lib"
version = "0.1.0"
description = "Library of exportable Python utilities and GUI components"
authors = [
    {name = "Paul Kirkaas", email = "pkirkaas@gmail.com"},
]
dependencies = [
    "pillow>=10.4.0",           # Image loading/saving
    "numpy>=1.24.0",            # Array operations
    "rich>=13.0.0",             # Rich terminal output and formatting
    "structlog>=23.0.0",        # Structured logging
    "PySide6>=6.10.0",           # Qt bindings for GUI
    "pyqtgraph>=0.13.0",        # Fast image display and plotting
    "click>=8.1.0",             # CLI framework
    "tqdm>=4.66.0",             # Progress bars
    "opencv-contrib-python>=4.8.0",     # Advanced image processing
    "scikit-image>=0.22.0",     # Image algorithms
    "imagehash>=4.3.1",         # Perceptual hashing (aHash, dHash, pHash)
    "PyWavelets>=1.5.0",        # Wavelet transforms for wHash
    "send2trash>=1.8.0",        # Safe file deletion to trash
    "exifread>=3.0.0",          # EXIF data reading
    "pillow-heif>=0.13.0",      # HEIF image support
    "jsonschema>=4.20.0",       # JSON schema validation
    "xxhash>=3.4.0",            # XXH3 fast hashing for duplicate detection
    "platformdirs>=4.0.0",      # Platform-specific directory paths
    "image-quality-analysis>=0.1.1",
    "pytest>=8.4.2",
    "hdbscan>=0.8.0",           # HDBSCAN clustering algorithm
    "scikit-learn>=1.3.0",      # Machine learning utilities for clustering
]
requires-python = "<3.14,>=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project.optional-dependencies]

dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=5.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pylint>=3.3.8",
]

[project.scripts]
pk-showcase = "showcase.app:run_showcase"
#pdtst =

[tool.pdm.scripts]
hi = "echo hello"
show =  {call = "showcase.app:run_showcase"}
imgapp = {call = "img_app.img_app.app:main"}
test = "pytest"



[tool.pdm]
distribution = true

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["E203", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/pk_py_lib --cov-report=html --cov-report=term-missing"
